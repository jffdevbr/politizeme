services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: politizeme
      POSTGRES_PASSWORD: politizeme
      POSTGRES_DB: politizeme
    volumes:
      - pgdata:/var/lib/postgresql/data # os dados persistem entre reinícios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politizeme"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://politizeme:politizeme@db:5432/politizeme
      SESSION_SECRET: ${SESSION_SECRET:-troque-este-segredo-em-producao-politizeme}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # Sem provedor de e-mail no protótipo: mostra o link de nova senha na tela (só para uso local).
      RECUPERACAO_DEMO: ${RECUPERACAO_DEMO:-1}

volumes:
  pgdata:
